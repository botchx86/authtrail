[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "authtrail"
version = "0.4.0"
description = "Explainable, offline SSH authentication log investigations"
requires-python = ">=3.10"
license = {text = "MIT"}

[project.scripts]
authtrail = "authtrail.cli:main"

[tool.setuptools.packages.find]
include = ["authtrail*"]
