name: Publish to PyPI
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing reviewed release tag, for example v0.4.3
        required: true
permissions:
  contents: read
jobs:
  publish:
    if: vars.PYPI_ENABLED == 'true'
    environment: pypi
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14'
      - name: Download reviewed published release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          python - <<'PY'
          import os, re
          assert re.fullmatch(r'v\d+\.\d+\.\d+', os.environ['RELEASE_TAG'])
          PY
          gh release view "$RELEASE_TAG" --json isDraft --jq 'if .isDraft then error("release must be published") else . end'
          gh release download "$RELEASE_TAG" --pattern '*.whl' --pattern '*.tar.gz' --pattern SHA256SUMS --dir dist
          (cd dist && sha256sum --check SHA256SUMS)
      - run: python -m pip install twine
      - run: python -m twine check --strict dist/*.whl dist/*.tar.gz
      - run: rm dist/SHA256SUMS
      - name: Publish wheel and source using trusted publishing
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086
        with:
          packages-dir: dist/
          attestations: true
