name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '${{ matrix.python }}'
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: python -m pip wheel . --no-deps -w dist
      - run: |
          python -m venv /tmp/authtrail-test
          /tmp/authtrail-test/bin/pip install dist/*.whl
          cd /tmp
          /tmp/authtrail-test/bin/authtrail --help
          /tmp/authtrail-test/bin/authtrail "$GITHUB_WORKSPACE/examples/logs/scenarios.log" --year 2026 --strict --compact-json --json /tmp/smoke.json
