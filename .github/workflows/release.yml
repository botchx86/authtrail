name: Release candidate
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '${{ matrix.python }}'
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
  package:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14'
      - run: python -m pip install build twine
      - run: python -m pip install -e .
      - name: Verify tag and versions
        run: |
          python - <<'PY'
          import os, tomllib
          from authtrail import __version__
          version = tomllib.load(open('pyproject.toml', 'rb'))['project']['version']
          assert os.environ['GITHUB_REF_NAME'] == 'v' + version
          assert __version__ == version
          PY
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: Check source and installed wheel
        run: |
          mkdir /tmp/source-check
          tar -xzf dist/*.tar.gz -C /tmp/source-check
          (cd /tmp/source-check/* && python -m pip install . && python -m unittest discover -s tests -v)
          python -m venv /tmp/release-check
          /tmp/release-check/bin/pip install dist/*.whl
          cd /tmp
          /tmp/release-check/bin/authtrail --version
          /tmp/release-check/bin/authtrail "$GITHUB_WORKSPACE/examples/logs/scenarios.log" --year 2026 --strict --json /tmp/report.json
      - name: Create draft release with checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd dist && sha256sum *.whl *.tar.gz > SHA256SUMS)
          gh release create "$GITHUB_REF_NAME" dist/*.whl dist/*.tar.gz dist/SHA256SUMS --verify-tag --draft --generate-notes
